# Alembic configuration for MirrorHub
# ─────────────────────────────────────
# Run migrations:   alembic upgrade head
# Create revision:  alembic revision --autogenerate -m "description"
# Show history:     alembic history
# Show current:     alembic current

[alembic]
script_location = alembic
prepend_sys_path = .

# async URL is fine for the app; env.py converts it to a sync URL for Alembic
sqlalchemy.url = sqlite:///./mirrorhub.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
